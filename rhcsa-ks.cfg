# Red Hat Enterprise Linux 10.2 - RHCSA Pearson 2.3 Lab
# -----------------------------------------------------

# System Language and Keyboard
lang en_GB.UTF-8
keyboard us

# Installation Source
cdrom

# Network Configuration
network --bootproto=dhcp --device=link --activate --hostname=dks-lab.localdomain

# Root Password (Change 'password' to your actual training password)
rootpw --iscrypted $6$Hyod0L2JhsN2PV92$ip1zynkAmZpPhyLACerCE5zBD59cRSM35dph96MzMG4Qf5BvvXKequfj3JkedBk9t7HpGAkMowCMHFeEqRtRd/

# ---------------------------------------------------------
# SYSTEM AUTHORIZATION & ACCESS
# ---------------------------------------------------------
# Create standard administrator with sudo (wheel) privileges
user --name=sysadmin --groups=wheel --password=redhat

# Inject macOS public SSH key for zero-touch Lima authentication
sshkey --username=root "ssh-ed25519 AAAAC3NzaC11ZDI1NTE5AAAAIIriEQy2XGk78M7xaqzN0InJxoqWs9ARcia+YneGmiXc homelab.csl@gmail.com"
sshkey --username=sysadmin "ssh-ed25519 AAAAC3NzaC11ZDI1NTE5AAAAIIriEQy2XGk78M7xaqzN0InJxoqWs9ARcia+YneGmiXc homelab.csl@gmail.com"

# System Timezone
timezone Europe/London --utc

# Perform a fresh text-based installation and reboot upon completion
text
poweroff  

# -----------------------------------------------------
# DISK PARTITIONING (Standard Partitions - RHCSA Lab 2.3)
# -----------------------------------------------------

# ISOLATION: Lock installation to primary drive, protect vdb/vdc and OEMDRV
ignoredisk --only-use=vda
clearpart --all --initlabel --drives=vda

# 1. Boot Partitions (Matched to Sander van Vugt specification)
part /boot/efi --fstype="efi" --size=1024 --ondisk=vda
part /boot --fstype="xfs" --size=1024 --ondisk=vda

# 2. Data & Swap Partitions
part /var/log --fstype="xfs" --size=5120 --ondisk=vda
part swap --fstype="swap" --size=2048 --ondisk=vda

# 3. Root Partition (Dynamically consumes remaining vda capacity)
part / --fstype="xfs" --size=1 --grow --ondisk=vda
%packages
@^minimal-environment
%end
