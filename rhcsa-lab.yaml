# ==============================================================================
# 🎯 RHCSA 1:1 EXAM PARITY LAB (Red Hat Enterprise Linux 10.2)
# ~/provisioning/rhcsa-lab.yaml
# ==============================================================================
vmType: 'vz'

vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false

images:
  - location: '~/provisioning/images/rhel-10.2-aarch64-kvm.qcow2'
    arch: 'aarch64'

cpus: 2
memory: 4GiB
disk: 20GiB

ssh:
  localPort: 50011
  overVsock: false

mounts: []
