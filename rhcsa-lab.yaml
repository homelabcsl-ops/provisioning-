# ==============================================================================
# DKS TARGET LAB: RHCSA 1:1 Parity (Official RHEL 10.2)
# STRICT EXAM MODE: Vanilla Bash, Base Vim, No Visual Aids
# ==============================================================================
vmType: 'qemu'
arch: 'aarch64'
cpus: 4
memory: '4GiB'
disk: '100GiB'

images:
  # Targets your local RHEL 10.2 ARM64 KVM image
  - location: '~/provisioning/rhel-10-red.qcow2'
    arch: 'aarch64'

mounts:
  - location: '~'
    writable: false
  # Strictly mount the vault for documentation. No dotfiles.
  - location: '~/obsidian/rhcsa'
    writable: true

networks:
  - lima: shared

provision:
  - mode: system
    script: |
      #!/bin/bash
      # 1. Strict SELinux Enforcing (Exam Parity)
      setenforce 1
      sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config

      # 2. User Context (Sterile Bash)
      useradd -m -s /bin/bash homelab.linux
      echo "homelab.linux ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/homelab

      # 3. Hostname routing for Aerospace regex
      hostnamectl set-hostname RHCSA_LAB
