# ==============================================================================
# 🎯 RHCSA 1:1 EXAM PARITY LAB (Red Hat Enterprise Linux 10.2)
# ==============================================================================
vmType: 'vz'
rosetta:
  enabled: true
  binfmt: true

images:
  - location: '~/provisioning/rhel-10-red.qcow2.iso'
    arch: 'aarch64'

cpus: 4
memory: '4GiB'
disk: '25GiB' # Primary OS Drive (vda)

# Attach raw block devices for RHCSA storage objectives
additionalDisks:
  - name: 'rhcsa-storage-1' # (vdb)
  - name: 'rhcsa-storage-2' # (vdc)

mountType: 'virtiofs'
mounts:
  - location: '~'
    writable: false
  - location: '~/obsidian/rhcsa'
    writable: true
  - location: '~/devops/ansible-lab'
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Bare minimum to ensure Ansible and VirtioFS bridge function
      dnf install -y tar rsync python3

portForwards:
  - guestSocket: '/run/user/{{.UID}}/podman/podman.sock'
    hostSocket: '{{.Dir}}/sock/podman.sock'
